model:
  bert_checkpoint: outputs/eyevq/pretrain_joint/ckpt_best.pt
  num_classes: 2
  dropout: 0.2

label:
  type: binary

train:
  seed: 42
  lr: 5.0e-5
  encoder_lr: 5.0e-5
  head_lr: 5.0e-5
  min_lr: 5.0e-6
  weight_decay: 0.05
  betas: [0.9, 0.95]
  batch_size: 16
  epochs: 30
  warmup_epochs: 1
  num_workers: 4
  prefetch_factor: 4
  grad_clip: 1.0
  early_stopping_patience: 5

data:
  data_dir: /mnt/disk_sde/hjf/eyemae_fast_dataset_v3/finetune/mci_binary
  train_index: train.csv
  val_index: validation.csv
  test_index: test.csv
  area_stats_path: outputs/area_stats_fast_packed_v2_clean_full_subject_seed20260622.json
