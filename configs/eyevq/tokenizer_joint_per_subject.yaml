model:
  architecture: joint

attention:
  stim_isolated: true

encoder:
  d_model: 384
  n_layers: 12
  n_heads: 8
  dim_ff: 1152
  dropout: 0.0
  max_patches: 128

decoder:
  d_model: 384
  n_layers: 3
  n_heads: 8
  dim_ff: 1152

vq:
  type: fsq
  fsq_d: 4
  fsq_L: [9, 7, 5, 5]
  commitment_beta: 0.25
  commitment_beta_end: 0.25
  min_nonmissing_frac: 0.50

patch:
  samples: 40
  stride: 40

area:
  require_contract: true
  use_log1p: false
  per_eye: true
  mad_scale: 1.4826
  mad_floor: 32.0
  min_subject_valid_frames: 10000
  clip: 5.0
  eps: 1.0e-6

manual_features:
  enabled: true
  num_features: 38
  cache_path: outputs/eyevq/per_subject/manual_features/trial_metrics_38d_valid_eyes_train_val.pt
  stats_path: outputs/eyevq/per_subject/manual_features/trial_metric_stats_38d_valid_eyes_train.json
  task_metric_weight_path: outputs/eyevq/per_subject/manual_features/train_valid_eyes.pt

loss:
  eye_xy_weight: 1.0
  eye_area_weight: 0.2
  eye_blink_weight: 0.1
  # Blink is already reconstructed at >99.7% precision/recall; class weighting
  # would over-emphasize a solved 3% positive target.
  eye_blink_pos_weight: 1.0
  # Velocity is normalized-frame first difference and has a much smaller raw
  # shared-encoder gradient than xy/area, so it needs a larger auxiliary scale.
  eye_velocity_weight: 5.0
  eye_recon_group_weight: 1.0
  # Full inverse-frequency BCE plus this 0.005 group weight dominates encoder
  # gradients; keep binary BCE unweighted and let the group weight do the work.
  manual_feature_balanced_bce: false
  manual_feature_group_weight: 0.005
  eye_commit_group_weight: 1.0

train:
  seed: 42
  precision: bf16
  compile_model: false
  kaiming_init: true
  lr: 2.0e-4
  min_lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 2000
  lr_decay_start_step: 2000
  stage_a_steps: 0
  stage_b_steps: 50000
  log_every_steps: 200
  val_every_steps: 5000
  save_every_steps: 5000
  max_val_batches: null
  max_trials_per_gpu: 128
  data_path: /mnt/disk_sde/hjf/eyemae_fast_dataset_v3/pretrain
  train_index: pretrain/pretrain_train.csv
  val_index: pretrain/pretrain_validation.csv
  require_any_eye_keep: true
  area_stats_path: outputs/eyevq/per_subject/area_stats_v5_valid_eyes_by_eye_all_subject_seed42.json
  num_workers: 4
