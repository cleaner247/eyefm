# Twelve-layer reference: independent short/long masked forwards, factorized CE.
attention:
  stim_isolated: true
  stim_attend_cls: false
bert:
  d_model: 384
  n_layers: 12
  n_heads: 8
  dim_ff: 1152
  dropout: 0.0
  max_time: 128
  max_patches: 128
  factorized_fsq: true
vq:
  type: fsq
  fsq_d: 4
  fsq_L: [9, 7, 5, 5]
  fsq_activation: tanh
  min_nonmissing_frac: 0.85
patch:
  samples: 40
  stride: 40
area:
  require_contract: true
  use_log1p: false
  per_eye: true
  mad_scale: 1.4826
  mad_floor: 32.0
  min_subject_valid_frames: 10000
  clip: 5.0
  eps: 1.0e-6
mask:
  mode: paired_dual_scale
  eye_masking_ratio: 0.50
  span_min_patches: 1
  span_max_patches: 6
  span_length_distribution: symmetric_power
  span_length_power: 1.0
  dual_short_num_blocks: 15
  dual_short_span_min_patches: 1
  dual_short_span_max_patches: 3
  dual_long_num_blocks: 5
  dual_long_span_min_patches: 4
  dual_long_span_max_patches: 6
  dual_min_gap: 1
loss:
  label_smoothing: 0.0
  masked_reduction: per_trial_then_global_valid_trial_mean_async
train:
  seed: 42
  precision: bf16
  compile_model: false
  lr: 3.0e-4
  min_lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.05
  grad_clip: 1.0
  warmup_steps: 1000
  total_steps: 20000
  lr_schedule_total_steps: 20000
  log_every_steps: 100
  val_every_steps: 5000
  max_val_batches: null
  save_every_steps: 5000
  data_path: /mnt/disk_sde/hjf/eyemae_fast_dataset_v6/pretrain
  train_index: pretrain/pretrain_train.csv
  val_index: pretrain/pretrain_validation.csv
  require_any_eye_keep: true
  area_stats_path: outputs/eyevq/v6_shared/area_stats_per_subject_eye_all_seed42.json
  tokenizer_checkpoint: outputs/eyevq/final/tokenizer/ckpt_final.pt
  code_ids_cache: outputs/eyevq/final/cache/code_ids_train_val.npz
  code_ids_cache_split: all
  max_seq_tokens_per_gpu: 262144
  max_trials_per_gpu: 64
  num_workers: 4
  prefetch_factor: 4
