recipe_version: 3
status: twelve_layer_reference
selection_policy: validation_only_for_model_selection
test_status: historically_observed_internal_exploration

dataset:
  version: eyemae_fast_dataset_v6
  root: /mnt/disk_sde/hjf/eyemae_fast_dataset_v6
  shared_artifacts: outputs/eyevq/v6_shared
  shared_artifact_manifest: configs/eyevq/final/artifact_manifest.json
  shared_artifact_manifest_sha256: a07847c542d525b5ca27869643fbc4e45423a16d59d40e507253c4faffb9a9ef
  manifest_sha256: a50d59ea13c885371349b4478ea1c7dacd6a89f1dd3005afd72c11856cc0cfe1
  build_audit: /mnt/disk_sde/hjf/eyemae_fast_dataset_v6/v6_build_audit.json
  build_audit_sha256: 8ab9ad8d6770c71c71752651cb1a7f263f19f99dddbc0d29123616382cee664d
  rationale: >-
    V6 is the operational default. It is a bitwise repack of the V5 signal
    payload with established subject/trial splits and source frame labels; the
    V6 builder adds no filtering, while the payload inherits V5's guarded
    75-Hz filter. Area statistics and manual features were recomputed from V6.

architecture:
  tokenizer: joint_stimulus_isolated_self_attention
  stimulus_reads_cls: false
  fsq_levels: [9, 7, 5, 5]
  bert_target: factorized_fsq_cross_entropy
  bert_mask: paired_dual_scale_short_15x1to3_long_5x4to6
  mci_aggregation: strict_four_task_k16_shared_logit_mean
  pd3_aggregation: strict_four_task_k16_shared_logit_mean_scheme_b

quality_gates:
  mode: advisory
  tokenizer:
    # V6 scale, calibrated against the completed non-collapsed 40K run.
    max_val_eye_loss: 0.0017
    max_val_feature_loss: 0.18
    min_active_codes: 1200
    min_code_perplexity: 500
    max_top1_code_frequency: 0.03
  bert:
    max_val_loss: 3.0
    min_exact_code_accuracy: 0.25
    min_per_dimension_accuracy: 0.60

downstream:
  seeds: [42, 43, 44]
  tasks: [mci, pd3]
  pd3_label_policy: control_vs_parkinson_plus_movement_disorder_vs_tremor_plus_et
  pd3_class_weighting: equal_heads_subject_inverse_frequency_within_head
  pd3_selection_metric: macro_auroc_ovr
  test_used_for_selection: false
