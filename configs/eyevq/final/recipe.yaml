  root: /mnt/disk_sde/hjf/eyemae_fast_dataset_v6
  shared_artifacts: outputs/eyevq/v6_shared
  shared_artifact_manifest: outputs/eyevq/v6_shared/artifact_manifest.json
  shared_artifact_manifest_sha256: 9ae7c94c864d3f41cb46a11a33f03e33a9658df3ba2e65ac73854fd3dcd2cbc5
