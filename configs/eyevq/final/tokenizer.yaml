# Canonical EyeVQ tokenizer used by the paper and production pipeline.
model:
  architecture: joint
attention:
  stim_isolated: true
  # Stimulus is an exogenous input.  If it reads CLS, eye information can
  # return through CLS after the first Transformer block.
  stim_attend_cls: false
encoder:
  d_model: 384
  n_layers: 12
  n_heads: 8
  dim_ff: 1152
  dropout: 0.0
  max_patches: 128
decoder:
  d_model: 384
  n_layers: 3
  n_heads: 8
  dim_ff: 1152
vq:
  type: fsq
  fsq_d: 4
  fsq_L: [9, 7, 5, 5]
  fsq_activation: tanh
  min_nonmissing_frac: 0.50
patch:
  samples: 40
  stride: 40
area:
  require_contract: true
  use_log1p: false
  per_eye: true
  mad_scale: 1.4826
  mad_floor: 32.0
  min_subject_valid_frames: 10000
  clip: 5.0
  eps: 1.0e-6
manual_features:
  enabled: true
  num_features: 38
  cache_path: outputs/eyevq/v6_shared/manual_features/trial_metrics_38d_train_val.pt
  stats_path: outputs/eyevq/v6_shared/manual_features/trial_metric_stats_38d_train.json
  task_metric_weight_path: outputs/eyevq/v6_shared/manual_features/train.pt
loss:
  eye_xy_weight: 1.0
  eye_area_weight: 0.1
  eye_blink_weight: 0.1
  eye_blink_pos_weight: 1.0
  eye_velocity_weight: 0.0
  eye_recon_group_weight: 1.0
  # Standard FSQ has no learned codebook and returns zero commitment loss.
  eye_commit_group_weight: 0.0
  manual_feature_balanced_bce: false
  manual_feature_group_weight: 0.0015
  manual_feature_binary_weight: 0.25
  manual_feature_continuous_weight: 1.5
train:
  seed: 42
  precision: bf16
  compile_model: false
  kaiming_init: true
  # V6 non-collapse pilot selected this lower schedule.
  lr: 2.0e-4
  min_lr: 2.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 2000
  lr_decay_start_step: 2000
  stage_a_steps: 0
  stage_b_steps: 40000
  log_every_steps: 100
  val_every_steps: 2500
  save_every_steps: 2500
  max_val_batches: null
  max_trials_per_gpu: 128
  data_path: /mnt/disk_sde/hjf/eyemae_fast_dataset_v6/pretrain
  train_index: pretrain/pretrain_train.csv
  val_index: pretrain/pretrain_validation.csv
  require_any_eye_keep: true
  area_stats_path: outputs/eyevq/v6_shared/area_stats_per_subject_eye_all_seed42.json
  num_workers: 4
