attention:
  stim_isolated: true

bert:
  d_model: 384
  n_layers: 12
  n_heads: 8
  dim_ff: 1152
  dropout: 0.0
  max_time: 128
  max_patches: 128
  factorized_fsq: false

vq:
  type: fsq
  fsq_d: 4
  fsq_L: [9, 7, 5, 5]
  min_nonmissing_frac: 0.85

patch:
  samples: 40
  stride: 40

mask:
  mode: uniform
  eye_masking_ratio: 0.25

loss:
  label_smoothing: 0.0

train:
  seed: 42
  precision: bf16
  compile_model: false
  lr: 5.0e-4
  min_lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.05
  grad_clip: 1.0
  warmup_steps: 2000
  total_steps: 50000
  log_every_steps: 100
  val_every_steps: 500
  save_every_steps: 5000
  data_path: /mnt/disk_sde/hjf/eyemae_fast_dataset_v3/pretrain
  train_index: pretrain/pretrain_train.csv
  val_index: pretrain/pretrain_validation.csv
  area_stats_path: outputs/area_stats_v3_tokenizer.json
  # Only used to validate the identity embedded in code_ids_cache.
  # The BERT process never loads this checkpoint.
  tokenizer_checkpoint: outputs/eyevq/tokenizer_joint_fsq9755_50k/ckpt_final.pt
  code_ids_cache: outputs/eyevq/code_ids_joint_fsq9755_50k_v2.npz
  max_seq_tokens_per_gpu: 262144
  max_trials_per_gpu: 256
  num_workers: 4
  prefetch_factor: 4
