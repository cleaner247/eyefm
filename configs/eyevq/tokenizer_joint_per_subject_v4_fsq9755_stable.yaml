model:
  architecture: joint

attention:
  stim_isolated: true

encoder:
  d_model: 384
  n_layers: 12
  n_heads: 8
  dim_ff: 1152
  dropout: 0.0
  max_patches: 128

decoder:
  d_model: 384
  n_layers: 3
  n_heads: 8
  dim_ff: 1152

vq:
  type: fsq
  fsq_d: 4
  fsq_L: [9, 7, 5, 5]
  # iFSQ: distribution-matched bounding before the unchanged 9755 grid.
  fsq_activation: ifsq
  ifsq_alpha: 1.6
  commitment_beta: 0.25
  commitment_beta_end: 0.25
  min_nonmissing_frac: 0.50

patch:
  samples: 40
  stride: 40

area:
  require_contract: true
  use_log1p: false
  per_eye: true
  mad_scale: 1.4826
  mad_floor: 32.0
  min_subject_valid_frames: 10000
  clip: 5.0
  eps: 1.0e-6

manual_features:
  enabled: true
  num_features: 38
  cache_path: outputs/eyevq/v4_shared/manual_features/trial_metrics_38d_train_val.pt
  stats_path: outputs/eyevq/v4_shared/manual_features/trial_metric_stats_38d_train.json
  task_metric_weight_path: outputs/eyevq/v4_shared/manual_features/train.pt

loss:
  eye_xy_weight: 1.0
  eye_area_weight: 0.2
  eye_blink_weight: 0.1
  eye_blink_pos_weight: 1.0
  # Velocity is a deterministic temporal derivative of xy.  Keep its raw
  # metric for diagnostics, but do not backpropagate a redundant objective.
  eye_velocity_weight: 0.0
  eye_velocity_start_step: 0
  eye_velocity_ramp_steps: 0
  eye_recon_group_weight: 1.0
  manual_feature_balanced_bce: false
  manual_feature_group_weight: 0.005
  eye_commit_group_weight: 1.0

train:
  seed: 42
  precision: bf16
  compile_model: false
  kaiming_init: true
  # Controlled 3K pilots selected 3e-4: it beat 2e-4 on final validation,
  # while 5e-4 regressed after its transient step-2500 advantage.
  lr: 3.0e-4
  min_lr: 2.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip: 1.0
  # This is LR warmup only. iFSQ quantization is active from the first step.
  warmup_steps: 2000
  lr_decay_start_step: 2000
  stage_a_steps: 0
  stage_b_steps: 50000
  log_every_steps: 100
  val_every_steps: 2500
  save_every_steps: 2500
  max_val_batches: null
  max_trials_per_gpu: 128
  data_path: /mnt/disk_sde/hjf/eyemae_fast_dataset_v4/pretrain
  train_index: pretrain/pretrain_train.csv
  val_index: pretrain/pretrain_validation.csv
  require_any_eye_keep: true
  area_stats_path: outputs/eyevq/v4_shared/area_stats_per_subject_eye_all_seed42.json
  num_workers: 4
