attention:
  stim_isolated: true

bert:
  d_model: 384
  n_layers: 12
  n_heads: 8
  dim_ff: 1152
  dropout: 0.0
  max_time: 128
  max_patches: 128
  factorized_fsq: false

vq:
  type: fsq
  fsq_d: 4
  fsq_L: [9, 7, 5, 5]
  fsq_activation: tanh
  min_nonmissing_frac: 0.85

patch:
  samples: 40
  stride: 40

area:
  require_contract: true
  use_log1p: false
  per_eye: true
  mad_scale: 1.4826
  mad_floor: 32.0
  min_subject_valid_frames: 10000
  clip: 5.0
  eps: 1.0e-6

mask:
  mode: paired_random
  eye_masking_ratio: 0.15
  span_min_patches: 2
  span_max_patches: 6

loss:
  label_smoothing: 0.0

train:
  seed: 42
  precision: bf16
  compile_model: false
  lr: 5.0e-4
  min_lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.05
  grad_clip: 1.0
  warmup_steps: 2000
  total_steps: 50000
  log_every_steps: 100
  val_every_steps: 5000
  max_val_batches: null
  save_every_steps: 5000
  data_path: /mnt/disk_sde/hjf/eyemae_fast_dataset_v5/pretrain
  train_index: pretrain/pretrain_train.csv
  val_index: pretrain/pretrain_validation.csv
  require_any_eye_keep: true
  area_stats_path: outputs/eyevq/v5_shared/area_stats_per_subject_eye_all_seed42.json
  tokenizer_checkpoint: outputs/eyevq/v5_fsq9755_recommended_tok40k_mask015_rawdemo16/tokenizer/ckpt_final.pt
  code_ids_cache: outputs/eyevq/v5_fsq9755_recommended_tok40k_mask015_rawdemo16/code_ids_train_val_tok40k.npz
  max_seq_tokens_per_gpu: 262144
  max_trials_per_gpu: 256
  num_workers: 4
  prefetch_factor: 4
