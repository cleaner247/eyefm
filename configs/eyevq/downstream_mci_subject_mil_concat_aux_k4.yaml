model:
  bert_checkpoint: outputs/eyevq/bert_joint_fsq9755_uniform25_50k/ckpt_final.pt
  freeze_embedding: true
  freeze_bottom_layers: 4
  classifier_hidden: 32
  dropout: 0.3

mil:
  task_ids: [0, 1, 2, 3]
  task_names: [ProSaccade, AntiSaccade, MemorySaccade, DoubleSaccade]
  subjects_per_gpu: 4
  class_sampling: epoch_shuffle_no_class_quota
  trials_per_task: 4
  train_require_all_tasks: true
  sample_without_replacement: true
  epoch_random_trial_sampling: true
  task_pooling: concat_task_cls_aux
  eval_use_all_trials: true

train:
  seed: 42
  epochs: 100
  encoder_lr: 1.0e-5
  head_lr: 1.0e-5
  encoder_min_lr: 1.0e-6
  head_min_lr: 1.0e-6
  layer_decay: 1.0
  warmup_epochs: 4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  grad_clip: 1.0
  bf16: true
  num_workers: 4
  prefetch_factor: 4
  eval_trial_batch_size: 16
  auxiliary_task_loss_weight: 0.1
  early_stopping_metric: val/subject/auroc
  early_stopping_min_epochs: 27
  early_stopping_patience_epochs: 10

data:
  pretraining_overlap_policy: allow_unlabeled_target_trials
  require_any_eye_keep: true
  data_dir: /mnt/disk_sde/hjf/eyemae_fast_dataset_v3/finetune/mci_binary
  train_index: train.csv
  val_index: validation.csv
  test_index: test.csv
  area_stats_path: /mnt/disk_sde/hjf/pxy_eyefm/outputs/eyevq/mci_downstream/area_stats_bert_frozen.json
