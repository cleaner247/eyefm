model:
  architecture: joint

attention:
  # In joint self-attention, Stim queries may read CLS/Stim, never L/R.
  # CLS and L/R queries may read the complete valid sequence.
  stim_isolated: true

encoder:
  d_model: 384
  n_layers: 12
  n_heads: 8
  dim_ff: 1152
  dropout: 0.0
  max_patches: 128

decoder:
  d_model: 384
  n_layers: 3
  n_heads: 8
  dim_ff: 1152

vq:
  type: fsq
  fsq_d: 4
  fsq_L: [9, 7, 5, 5]
  commitment_beta: 0.25
  commitment_beta_end: 0.25
  min_nonmissing_frac: 0.50

patch:
  samples: 40
  stride: 40

manual_features:
  enabled: true
  num_features: 38
  cache_path: outputs/trial_metrics_cache_v3_38d_unlock.pt
  stats_path: outputs/trial_metric_stats_v3_38d_unlock.json
  task_metric_weight_path: taskaware_weighted_38_features_v3_20260731/full/train.pt

loss:
  eye_xy_weight: 1.0
  eye_area_weight: 0.2
  eye_blink_weight: 0.1
  eye_blink_pos_weight: 1.0
  eye_velocity_weight: 5.0
  eye_recon_group_weight: 1.0
  manual_feature_balanced_bce: false
  manual_feature_group_weight: 0.005
  eye_commit_group_weight: 1.0

train:
  seed: 42
  precision: bf16
  compile_model: false
  # Proven initialization for this 384d/12-layer FSQ tokenizer; without it
  # the initial code usage collapses (step-200 perplexity ~25 instead of ~320).
  kaiming_init: true
  lr: 2.0e-4
  min_lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 2000
  stage_a_steps: 0
  stage_b_steps: 50000
  log_every_steps: 200
  val_every_steps: 1000
  save_every_steps: 5000
  max_val_batches: 50
  max_trials_per_gpu: 128
  data_path: /mnt/disk_sde/hjf/eyemae_fast_dataset_v3/pretrain
  train_index: pretrain/pretrain_train.csv
  val_index: pretrain/pretrain_validation.csv
  area_stats_path: outputs/area_stats_v3_tokenizer.json
  num_workers: 4
