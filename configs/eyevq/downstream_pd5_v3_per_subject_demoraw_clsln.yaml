model:
  bert_checkpoint: outputs/eyevq/v3_ifsq9755_recommended_tok40k_mask015_rawdemo16/bert/ckpt_final.pt
  freeze_embedding: true
  freeze_bottom_layers: 4
  classifier_hidden: 128
  classifier_head: mlp
  dropout: 0.3

label:
  type: multiclass
  num_classes: 5
  class_names: [control, parkinson, tremor, essential_tremor, dyskinesia]

mil:
  task_ids: [0, 1, 2, 3]
  task_names: [ProSaccade, AntiSaccade, MemorySaccade, DoubleSaccade]
  subjects_per_gpu: 4
  class_sampling: epoch_shuffle_no_class_quota
  trials_per_task: 4
  train_require_all_tasks: true
  sample_without_replacement: true
  epoch_random_trial_sampling: true
  task_pooling: shared_head_mean
  trial_pooling: logit_mean
  eval_use_all_trials: true

train:
  seed: 42
  class_weighting: subject_inverse_frequency
  epochs: 100
  encoder_lr: 1.0e-5
  head_lr: 1.0e-5
  encoder_min_lr: 1.0e-6
  head_min_lr: 1.0e-6
  layer_decay: 1.0
  warmup_epochs: 4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  grad_clip: 1.0
  bf16: true
  num_workers: 4
  prefetch_factor: 4
  eval_trial_batch_size: 64
  early_stopping_metric: val/subject/macro_auroc_ovr
  early_stopping_min_epochs: 27
  early_stopping_patience_epochs: 20
  num_trial_views: 1
  trial_view_consistency_weight: 0.0
  auxiliary_task_loss_weight: 0.0
  feature_mixup_alpha: 0.0

data:
  pretraining_overlap_policy: allow_unlabeled_target_trials
  area_stats_mode: per_subject_transductive
  require_any_eye_keep: true
  data_dir: /mnt/disk_sde/hjf/eyemae_fast_dataset_v3/finetune/pd_related_5class
  train_index: train.csv
  val_index: validation.csv
  test_index: test.csv
  area_stats_path: /mnt/disk_sde/hjf/pxy_eyefm/outputs/eyevq/per_subject/area_stats_v5_valid_eyes_by_eye_all_subject_seed42.json

demographics:
  enabled: true
  fusion: concat_task_cls
  projection_dim: 0
  age_encoding: zscore
  features: [age, education, sex]
