data:
  format: packed_mmap
  data_dir: /mnt/disk_sde/hjf/eyemae_fast_dataset_v3/pretrain
  # Deliberately unlabeled and transductive: cover train/validation/test and
  # every downstream MCI subject with one fixed preprocessing file.
  train_index: pretrain/pretrain_all_unique.csv
  max_open_shards_per_worker: 44
  validate_offsets: true
  enforce_suffix_eye_availability: true

split:
  seed: 42

label:
  nonblink_value: 0
  blink_value: 1
  missing_value: 2

area:
  use_log1p: true
  robust_zscore_by: subject
  clip: 5
  eps: 1.0e-6
  stats_path: outputs/eyevq/per_subject/area_stats_v3_all_subject_full_seed42.json
  global_reference_path: outputs/area_stats_v3_tokenizer.json
  max_frames_per_subject: null
  max_global_frames: null
