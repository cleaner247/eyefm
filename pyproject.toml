[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyemae"
version = "0.2.0"
description = "EyeVQ tokenization, masked pretraining, and subject-level eye-movement modeling"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyyaml",
  "torch",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
eyevq-pipeline = "eyemae.eyevq.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
